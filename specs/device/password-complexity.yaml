name: Password Complexity
terraform_provider_config:
  description: Administrator password complexity (mgt-config/password-complexity)
  skip_resource: false
  skip_datasource: false
  resource_type: config
  resource_variants: []
  suffix: password_complexity_settings
  xml_node: password-complexity
  plural_suffix: ''
  plural_name: ''
  plural_description: ''
  custom_validation: false
go_sdk_config:
  skip: false
  package:
  - device
  - password_complexity
panos_xpath:
  path:
  - mgt-config
  - password-complexity
  vars: []
locations:
- name: system
  xpath:
    path:
    - config
    vars: []
  description: System-level configuration
  devices:
  - panorama
  - ngfw
  validators: []
  required: false
  read_only: false
- name: template
  xpath:
    path:
    - config
    - devices
    - $panorama_device
    - template
    - $template
    - config
    vars:
    - name: panorama_device
      description: Specific Panorama device
      required: false
      default: localhost.localdomain
      validators: []
      type: entry
    - name: template
      description: Specific Panorama template
      required: true
      validators: []
      type: entry
  description: Located in a specific template
  devices:
  - panorama
  validators: []
  required: false
  read_only: false
- name: template-stack
  xpath:
    path:
    - config
    - devices
    - $panorama_device
    - template-stack
    - $template_stack
    - config
    vars:
    - name: panorama_device
      description: Specific Panorama device
      required: false
      default: localhost.localdomain
      validators: []
      type: entry
    - name: template_stack
      description: Specific Panorama template stack
      required: true
      validators: []
      type: entry
  description: Located in a specific template stack
  devices:
  - panorama
  validators: []
  required: false
  read_only: false
entries: []
spec:
  params:
  - name: enabled
    type: bool
    profiles:
    - xpath:
      - enabled
    validators: []
    spec: {}
    description: Enforce minimum password complexity.
    required: false
  - name: minimum-length
    type: int64
    profiles:
    - xpath:
      - minimum-length
    validators: []
    spec: {}
    description: Minimum password length.
    required: false
  - name: minimum-uppercase-letters
    type: int64
    profiles:
    - xpath:
      - minimum-uppercase-letters
    validators: []
    spec: {}
    description: Minimum uppercase letters.
    required: false
  - name: minimum-lowercase-letters
    type: int64
    profiles:
    - xpath:
      - minimum-lowercase-letters
    validators: []
    spec: {}
    description: Minimum lowercase letters.
    required: false
  - name: minimum-numeric-letters
    type: int64
    profiles:
    - xpath:
      - minimum-numeric-letters
    validators: []
    spec: {}
    description: Minimum digits.
    required: false
  - name: minimum-special-characters
    type: int64
    profiles:
    - xpath:
      - minimum-special-characters
    validators: []
    spec: {}
    description: Minimum non-alphanumeric characters.
    required: false
  - name: block-repeated-characters
    type: int64
    profiles:
    - xpath:
      - block-repeated-characters
    validators: []
    spec: {}
    description: Block a character repeated this many times.
    required: false
  - name: block-username-inclusion
    type: bool
    profiles:
    - xpath:
      - block-username-inclusion
    validators: []
    spec: {}
    description: Block the username and its reverse in the password.
    required: false
  - name: new-password-differs-by-characters
    type: int64
    profiles:
    - xpath:
      - new-password-differs-by-characters
    validators: []
    spec: {}
    description: Characters a new password must differ by.
    required: false
  - name: password-change-on-first-login
    type: bool
    profiles:
    - xpath:
      - password-change-on-first-login
    validators: []
    spec: {}
    description: Force a password change at first login.
    required: false
  - name: password-history-count
    type: int64
    profiles:
    - xpath:
      - password-history-count
    validators: []
    spec: {}
    description: Previous passwords that cannot be reused.
    required: false
  - name: password-change-period-block
    type: int64
    profiles:
    - xpath:
      - password-change-period-block
    validators: []
    spec: {}
    description: Days before a password may be changed again.
    required: false
  - name: password-change
    type: object
    profiles:
    - xpath:
      - password-change
    validators: []
    spec:
      params:
      - name: expiration-period
        type: int64
        profiles:
        - xpath:
          - expiration-period
        validators: []
        spec: {}
        description: Days until a password expires.
        required: false
      - name: expiration-warning-period
        type: int64
        profiles:
        - xpath:
          - expiration-warning-period
        validators: []
        spec: {}
        description: Days of warning before expiry.
        required: false
      - name: post-expiration-admin-login-count
        type: int64
        profiles:
        - xpath:
          - post-expiration-admin-login-count
        validators: []
        spec: {}
        description: Admin logins allowed after expiry.
        required: false
      - name: post-expiration-grace-period
        type: int64
        profiles:
        - xpath:
          - post-expiration-grace-period
        validators: []
        spec: {}
        description: Days of grace after expiry.
        required: false
      variants: []
    description: Password expiry.
    required: false
  variants: []
